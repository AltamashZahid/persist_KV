name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (ASan + UBSan)
            os: ubuntu-latest
            cxx: g++
            cmake_args: -DPKV_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          - name: Linux Clang (ThreadSanitizer)
            os: ubuntu-latest
            cxx: clang++
            cmake_args: -DPKV_TSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - name: Windows MSVC
            os: windows-latest
            cxx: ""
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and crash tests
        shell: bash
        run: |
          set +e
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Surface failing lines as annotations so they are visible without log access.
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL|threw|error|Error|failure|Sanitizer|SUMMARY" test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Randomized crash fuzzing (500 runs)
        if: runner.os == 'Linux' && !contains(matrix.cmake_args, 'TSAN')
        working-directory: build
        run: ./crash_test fuzz 500 ${{ github.run_number }}
